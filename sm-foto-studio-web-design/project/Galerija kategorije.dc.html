<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;600;800&family=Archivo:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f5f3ee; }
  * { box-sizing: border-box; }
  a { color: #12110f; text-decoration: none; }
  a:hover { color: #6b675e; }
  @keyframes v2Fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes v2Rise { from { transform: translateY(102%); } to { transform: translateY(0); } }
  @keyframes v2Rule { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes v2Reveal { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
  [data-tile]:hover [data-tile-cap] { opacity: 1; }
</style>
</helmet>
<div style="min-height: 100vh; background: #f5f3ee; color: #12110f; font-family: Archivo, Helvetica, sans-serif; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 32px; padding: 22px 40px; border-bottom: 1px solid #12110f; animation: v2Fade .8s ease .05s both;">
    <a href="#rafting" style="display: flex; align-items: center; gap: 12px;">
      <img src="uploads/610553248_18017187089801123_5097008291130239999_n.jpg" alt="SM Foto Studio" style="display: block; width: 52px; height: 52px; object-fit: contain; mix-blend-mode: multiply;" />
      <span style="display: block; width: 1px; height: 26px; background: rgba(18,17,15,0.2);"></span>
      <span style="font-family: 'Big Shoulders Display', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: #6b675e;">Fotografija<br />Tara &amp; Drina</span>
    </a>
    <nav data-nav="" style="display: flex; align-items: center; gap: 26px; font-size: 11px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;">
      <a href="#rafting" data-cat="rafting">Rafting</a>
      <a href="#vencanja" data-cat="vencanja">Venčanja</a>
      <a href="#krstenja" data-cat="krstenja">Krštenja</a>
      <a href="#rodjendani" data-cat="rodjendani">Rođendani</a>
      <a href="O%20nama.dc.html">O nama</a>
    </nav>
  </header>

  <div data-head="" style="padding: 74px 40px 34px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 0.82fr); gap: 56px; align-items: end;">
    <div>
      <span data-kicker="" style="display: block; font-family: ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(18,17,15,0.5);">Galerija</span>
      <span style="display: block; overflow: hidden; margin-top: 14px;">
        <h1 data-title="" style="margin: 0; font-family: 'Big Shoulders Display', sans-serif; font-weight: 800; font-size: clamp(60px, 9vw, 150px); line-height: 0.82; text-transform: uppercase; letter-spacing: -0.02em; animation: v2Rise .85s cubic-bezier(.16,1,.3,1) both;">Rafting</h1>
      </span>
    </div>
    <div style="padding-bottom: 12px;">
      <p data-desc="" style="margin: 0; max-width: 44ch; font-size: 16.5px; line-height: 1.6; color: #3a3833; text-wrap: pretty;">Spustovi Tarom i Drinom. Svaki čamac dobija svoju galeriju istog dana, fotografije poređane po broju čamca.</p>
      <span data-count="" style="display: block; margin-top: 18px; font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: rgba(18,17,15,0.5);">24 fotografije · sezona 2026</span>
    </div>
  </div>

  <span style="display: block; height: 1px; margin: 0 40px; background: #12110f; transform-origin: left; animation: v2Rule 1s cubic-bezier(.16,1,.3,1) .2s both;"></span>

  <div data-grid="" style="flex: 1; padding: 34px 40px 96px; column-count: 3; column-gap: 12px;"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;category&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rafting&quot;,&quot;vencanja&quot;,&quot;krstenja&quot;,&quot;rodjendani&quot;],&quot;default&quot;:&quot;rafting&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Sadržaj&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;min&quot;:9,&quot;max&quot;:48,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Sadržaj&quot;}}">
const CATS = {
  rafting: {
    title: "Rafting",
    desc: "Spustovi Tarom i Drinom. Svaki čamac dobija svoju galeriju istog dana, fotografije poređane po broju čamca.",
    kicker: "Galerija · reka",
    meta: "sezona 2026",
    tones: ["#d7d2c6", "#cdc8bb", "#e0dbcf", "#c8c3b6"],
    prefix: "RAF"
  },
  vencanja: {
    title: "Venčanja",
    desc: "Ceo dan, od pripreme do zadnjeg plesa. Snimamo u crkvi, na reci i u sali, bez postavljanja i ponavljanja kadrova.",
    kicker: "Galerija · venčanja",
    meta: "2024 — 2026",
    tones: ["#e6e1d6", "#efece4", "#ddd8cc", "#e9e4d9"],
    prefix: "VEN"
  },
  krstenja: {
    title: "Krštenja",
    desc: "Obred i porodično okupljanje posle njega. Tiho snimanje, uz dogovor sa crkvom oko mesta i svetla.",
    kicker: "Galerija · krštenja",
    meta: "cele godine",
    tones: ["#e3ded3", "#d9d4c8", "#eae6dc", "#d2ccc0"],
    prefix: "KRS"
  },
  rodjendani: {
    title: "Rođendani",
    desc: "Dečji i porodični rođendani, u sali ili na otvorenom. Reportaža kroz ceo dan, torta i gosti uključeni.",
    kicker: "Galerija · rođendani",
    meta: "cele godine",
    tones: ["#e0d9cb", "#d5cec0", "#e8e1d3", "#cec7b9"],
    prefix: "ROD"
  }
};
const ORDER = ["rafting", "vencanja", "krstenja", "rodjendani"];
const RATIOS = [0.72, 1.34, 1, 0.78, 1.5, 0.68, 1.12, 0.82];

class Component extends DCLogic {
  componentDidMount() {
    this.root = document.body;
    this.count = Math.max(3, this.props.count ?? 24);
    this.onHash = () => this.route();
    window.addEventListener("hashchange", this.onHash);
    this.route();
  }
  componentWillUnmount() {
    window.removeEventListener("hashchange", this.onHash);
  }

  q(sel) { return this.root.querySelector(sel); }
  qa(sel) { return Array.from(this.root.querySelectorAll(sel)); }

  route() {
    const hash = (location.hash || "").replace("#", "");
    const key = CATS[hash] ? hash : (this.props.category ?? "rafting");
    this.cat = CATS[key] ? key : "rafting";
    const c = CATS[this.cat];
    const t = this.q("[data-title]");
    const d = this.q("[data-desc]");
    const k = this.q("[data-kicker]");
    const n = this.q("[data-count]");
    if (t) { t.textContent = c.title; t.style.animation = "none"; t.style.animation = "v2Rise .85s cubic-bezier(.16,1,.3,1) both"; }
    if (d) d.textContent = c.desc;
    if (k) k.textContent = c.kicker;
    if (n) n.textContent = `${this.count} fotografija · ${c.meta}`;
    this.qa("[data-nav] [data-cat]").forEach(a => {
      const on = a.getAttribute("data-cat") === this.cat;
      a.style.color = on ? "#c1272d" : "#12110f";
      a.style.borderBottom = on ? "1px solid #c1272d" : "1px solid transparent";
      a.style.paddingBottom = "3px";
    });
    this.buildGrid();
  }

  buildGrid() {
    const grid = this.q("[data-grid]");
    if (!grid) return;
    const c = CATS[this.cat];
    grid.textContent = "";
    for (let i = 0; i < this.count; i++) {
      const tile = document.createElement("figure");
      tile.setAttribute("data-tile", "");
      const ratio = RATIOS[i % RATIOS.length];
      const tone = c.tones[i % c.tones.length];
      tile.style.cssText = `position:relative;margin:0 0 12px;break-inside:avoid;aspect-ratio:${ratio};background-color:${tone};background-image:repeating-linear-gradient(112deg,rgba(18,17,15,.07) 0 2px,rgba(18,17,15,0) 2px 15px);overflow:hidden;animation:v2Reveal .6s cubic-bezier(.16,1,.3,1) ${Math.min(i, 12) * 0.045}s both;`;
      const cap = document.createElement("figcaption");
      cap.setAttribute("data-tile-cap", "");
      cap.style.cssText = "position:absolute;left:12px;bottom:10px;opacity:0;transition:opacity .25s ease;font-family:ui-monospace,monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:rgba(18,17,15,.62);";
      cap.textContent = `${c.prefix}_${String(1240 + i * 7)}`;
      tile.appendChild(cap);
      grid.appendChild(tile);
    }
  }

  renderVals() { return {}; }
}
</script>
</body>
</html>
